[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fuel-intelligence-ecuador"
version = "0.5.0"
description = "Monitor verificable de combustibles para Ecuador con alertas privadas por Telegram."
requires-python = ">=3.11"
dependencies = [
  "playwright>=1.52,<2",
  "pypdf>=5,<7",
  "websockets>=13,<16",
  "duckdb>=1.4,<2",
  "polars>=1.35,<2",
  "pyarrow>=21,<24",
  "xlrd>=2.0,<3",
  "tzdata>=2025.2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
fuelintel = "fuelintel.main:main"
fuelintel-setup-telegram = "fuelintel.setup_telegram:main"

[tool.setuptools.packages.find]
include = ["fuelintel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
