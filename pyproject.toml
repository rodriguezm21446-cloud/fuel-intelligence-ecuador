[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fuel-intelligence-ecuador"
version = "0.1.0"
description = "Monitor verificable de combustibles para Ecuador con alertas privadas por Telegram."
requires-python = ">=3.11"
dependencies = [
  "pillow>=10,<13",
  "pypdf>=5,<7",
  "openbb>=4.7,<5",
  "openbb-yfinance>=1.6,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
fuelintel = "fuelintel.main:main"
fuelintel-setup-telegram = "fuelintel.setup_telegram:main"

[tool.setuptools.packages.find]
include = ["fuelintel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

