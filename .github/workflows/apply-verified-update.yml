name: Apply verified editorial update

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Apply verified source archive
        run: |
          tar -xzf fuelintel-update-20260922.tgz
          git restore --source=HEAD -- .github/workflows/cloud-job.yml .github/workflows/watchdog.yml
          rm fuelintel-update-20260922.tgz
      - name: Commit verified update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Improve editorial charts and monitoring reliability"
          git push
