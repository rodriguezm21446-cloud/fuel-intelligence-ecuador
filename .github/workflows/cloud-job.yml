name: Fuel Intelligence Cloud Job

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cloud-job.yml"
  workflow_dispatch:
    inputs:
      source_id:
        description: Source identifier selected by Cloudflare
        required: true
        type: string
      source_name:
        description: Human-readable source name
        required: true
        type: string
      source_url:
        description: Monitored source URL
        required: true
        type: string
      event_url:
        description: New article or document URL
        required: true
        type: string
      event_title:
        description: New article or document title
        required: true
        type: string
      detected_at:
        description: UTC detection timestamp
        required: true
        type: string
      corroborated_by:
        description: Independent confirming source when required
        required: false
        type: string
  schedule:
    - cron: "17 */5 * * *"

permissions:
  contents: read

concurrency:
  group: fuelintel-state
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FUELINTEL_DATA_DIR: data/runtime
      FUELINTEL_DRY_RUN: "false"
      FUELINTEL_TELEGRAM_ENABLED: "true"
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-3.5-flash-lite
      FUELINTEL_AI_REVISION: "7"
      FUELINTEL_CHART_REVISION: "3"
      FUELINTEL_BRAND_NAME: "@PreciosCombustibleEC"
      FUELINTEL_EVENT_SOURCE_ID: ${{ inputs.source_id }}
      FUELINTEL_EVENT_URL: ${{ inputs.event_url }}
      FUELINTEL_EVENT_TITLE: ${{ inputs.event_title }}
      FUELINTEL_EVENT_DETECTED_AT: ${{ inputs.detected_at }}
      FUELINTEL_EVENT_CORROBORATED_BY: ${{ inputs.corroborated_by }}
    steps:
      - name: Checkout private repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Restore analysis memory
        uses: actions/cache/restore@v4
        with:
          path: data/runtime
          key: fuelintel-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            fuelintel-state-

      - name: Install verified dependencies
        run: python -m pip install --disable-pip-version-check .

      - name: Install Chromium for chart rendering
        run: python -m playwright install --with-deps chromium

      - name: Validate calculations and chart rules
        if: github.event_name == 'push'
        run: python -m unittest discover -s tests -v

      - name: Analyze detected event
        if: github.event_name == 'workflow_dispatch'
        run: python -m fuelintel.cloud_job

      - name: Generate scheduled dashboard
        if: github.event_name == 'schedule'
        run: python -m fuelintel.main --dashboard

      - name: Verify Gemini connection
        if: github.event_name == 'push'
        run: |
          python - <<'PY'
          import os
          from fuelintel.ai import GeminiEditor

          editor = GeminiEditor(
              os.environ.get("GEMINI_API_KEY", ""),
              os.environ.get("GEMINI_MODEL", "gemini-3.5-flash-lite"),
              timeout_seconds=90,
          )
          result = editor.review(
              "Prueba técnica. Extra cuesta $3,21 por galón. No añadas información.",
              "Prueba técnica de Gemini para Fuel Intelligence Ecuador.",
          )
          if result is None:
              raise SystemExit(f"Gemini no confirmó una respuesta: {editor.last_error}")
          print("Gemini respondió correctamente; texto para X dentro del límite:", len(result.x_text))
          PY

      - name: Generate and send OpenBB test chart
        if: github.event_name == 'push'
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from fuelintel.openbb_chart import generate_openbb_market_chart
          from fuelintel.telegram import TelegramNotifier

          chart = generate_openbb_market_chart(Path("data/runtime/charts/openbb-test.png"))
          if chart is None:
              raise SystemExit("OpenBB no entregó una serie verificable")
          sent = TelegramNotifier(
              os.environ["TELEGRAM_BOT_TOKEN"], os.environ["TELEGRAM_CHAT_ID"], True, False
          ).send_photo(chart, "PRUEBA VISUAL — WTI y Brent. Diseño editorial generado con Python y datos obtenidos mediante OpenBB.")
          if not sent:
              raise SystemExit("Telegram no confirmó el gráfico OpenBB")
          PY

      - name: Save analysis memory
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/runtime
          key: fuelintel-state-${{ github.run_id }}-${{ github.run_attempt }}

