name: Fuel Intelligence Watchdog
on:
  workflow_dispatch:
  schedule:
    - cron: "7 */6 * * *"
permissions:
  contents: read
concurrency:
  group: fuelintel-watchdog
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check detector independently
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          url = "https://fuelintel-ecuador.rodriguezm21446.workers.dev/health"
          healthy = False
          details = "sin respuesta JSON"
          try:
              # Cloudflare rejects the default python-urllib agent, so identify clearly.
              request = urllib.request.Request(
                  url, headers={"User-Agent": "FuelIntelligenceEcuador/0.1 (+private monitor watchdog)"}
              )
              with urllib.request.urlopen(request, timeout=20) as response:
                  data = json.load(response)
              healthy = data.get("status") in {"ok", "partial"} and bool(data.get("revision"))
              details = (
                  f"estado={data.get('status', 'desconocido')}; "
                  f"fuentes críticas={','.join(data.get('criticalUnavailableSources', [])) or 'ninguna'}; "
                  f"fuentes parciales={','.join(data.get('unavailableSources', [])) or 'ninguna'}"
              )
          except Exception as error:
              details = f"{type(error).__name__}: {error}"
          if not healthy:
              token, chat = os.getenv("TELEGRAM_BOT_TOKEN"), os.getenv("TELEGRAM_CHAT_ID")
              if token and chat:
                  payload = json.dumps({"chat_id": chat, "text": "Aviso técnico de combustibleEc: el detector requiere revisión. " + details + ". Las fuentes restantes continúan."}).encode()
                  request = urllib.request.Request(f"https://api.telegram.org/bot{token}/sendMessage", data=payload, headers={"Content-Type": "application/json"})
                  try:
                      with urllib.request.urlopen(request, timeout=15) as response:
                          if not json.load(response).get("ok"):
                              print("Telegram no confirmó el aviso técnico")
                  except Exception:
                      print("No se pudo entregar el aviso técnico")
              raise SystemExit("Detector no saludable: " + details)
          print("Detector saludable: " + details)
          PY
